services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CHAT_API_TOKEN: ${CHAT_API_TOKEN:-}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-0}
      ENABLE_REMOTE_LLM: ${ENABLE_REMOTE_LLM:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - supportlens-data:/app/instance
    restart: unless-stopped
  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  supportlens-data:
