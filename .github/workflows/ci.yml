name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m scripts.evaluate --strict --output evaluation/results.json
      - run: python -m scripts.check_assets
      - run: python -m scripts.smoke_test
      - run: python -m scripts.benchmark --iterations 100
      - run: python -m compileall -q src backend
      - run: node --check site/app.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-faq-evaluation
          path: evaluation/results.json
          if-no-files-found: ignore
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
