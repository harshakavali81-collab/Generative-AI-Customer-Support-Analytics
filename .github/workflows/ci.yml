name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m scripts.evaluate --strict --output evaluation/results.json
      - run: python -m scripts.check_assets
      - run: python -m scripts.smoke_test
      - run: python -m scripts.benchmark --iterations 100
      - run: python -m compileall -q src backend
      - run: node --check site/app.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-faq-evaluation
          path: evaluation/results.json
          if-no-files-found: ignore
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
  browser-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real browser test dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Exercise fully local browser showcase with Chromium
        run: python -m scripts.browser_e2e
      - name: Upload real browser screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supportlens-browser-screenshots
          path: browser-test-output/
          if-no-files-found: warn
          retention-days: 14
  docker-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start FastAPI + React + Nginx
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify real reverse proxy and cited API response
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/ | grep -qi "SupportLens"
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/api/health | python3 -c "import json,sys; x=json.load(sys.stdin); assert x['status']=='ok' and x['indexed_chunks']>0"
          curl --fail --silent --show-error --max-time 15             -H 'Content-Type: application/json'             -d '{"question":"How do I reset my password?"}'             http://127.0.0.1:8080/api/chat             | python3 -c "import json,sys; x=json.load(sys.stdin); assert x['answered'] and x['citations'] and '[source:' in x['answer']"
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --tail 90
      - name: Remove test containers and demo data volume
        if: always()
        run: docker compose down -v --remove-orphans
